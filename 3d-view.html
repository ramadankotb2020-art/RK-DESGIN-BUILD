<!DOCTYPE html>

<title>معاينة مخطط الغرفة ثلاثي الأبعاد | RK Design Studio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0e1117;overflow:hidden;font-family:Cairo,-apple-system,sans-serif}
#cv{display:block;touch-action:none}
#bar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:6px;padding:10px 12px;
  background:rgba(10,10,14,.88);backdrop-filter:blur(10px);flex-wrap:wrap}
#bar a,#bar button{font:inherit;font-size:12px;font-weight:700;padding:8px 14px;border-radius:8px;
  border:1px solid rgba(197,160,89,.2);background:rgba(197,160,89,.06);color:#c5a059;cursor:pointer;
  text-decoration:none;min-height:40px;display:inline-flex;align-items:center;white-space:nowrap;transition:.2s}
#bar a:hover,#bar button:hover{background:rgba(197,160,89,.18);border-color:#c5a059}
#bar .sp{flex:1;min-width:4px}
#bar .info{font-size:11px;color:rgba(255,255,255,.35)}
#hint{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(10,10,14,.7);
  color:rgba(255,255,255,.35);font-size:11px;padding:6px 14px;border-radius:14px;pointer-events:none}
#err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;background:#0e1117}
#err .c{text-align:center;max-width:340px;padding:30px}
#err h3{color:#c5a059;font-size:20px;margin-bottom:12px}
#err p{color:rgba(255,255,255,.45);font-size:14px;line-height:1.7;margin-bottom:20px}
#err a{display:inline-block;padding:12px 28px;border-radius:10px;background:#c5a059;color:#0a0a0a;font-weight:700;text-decoration:none}
</style>
<link rel="canonical" href="https://rk-desgin-build-2an.pages.dev/3d-view">

<body>
<div id="bar">
  <a href="room-designer.html">← رجوع</a>
  <button id="btnSpin">⟳ دوران</button>
  <button id="btnTop">⬆ علوي</button>
  <span class="sp"></span>
  <span class="info" id="info"></span>
  <button id="btnOut">−</button>
  <button id="btnIn">+</button>
</div>
<canvas id="cv"></canvas>
<div id="hint">اسحب للدوران · +- للتكبير</div>
<div id="err"><div class="c"><h3>ارسم غرفتك الأول</h3><p>مفيش تصميم محفوظ — ارجع للمخطط وارسم غرفتك.</p><a href="room-designer.html">← ارسم غرفتك</a></div></div>
<script>
(function(){
'use strict';
var R; try{R=localStorage.getItem('rkdesign_planner_v2')}catch(e){}
if(!R)return; var P; try{P=JSON.parse(R)}catch(e){return}
var W=P.walls||[],I=P.items||[],RM=P.rooms||[];
if(!W.length&&!I.length)return;
document.getElementById('err').style.display='none';

var cv=document.getElementById('cv'),x=cv.getContext('2d');
var ang=35*Math.PI/180,sc=35,ox=0,oy=0,spin=false,topView=false,WH=2.7;
var COL={sofa:'#9a7b4e',armchair:'#b08d57',bed:'#d4c4a8',wardrobe:'#a98454',table:'#cda670',
  desk:'#cda670',chair:'#b08d57',fridge:'#c8cdd2',stove:'#6a6a6a',sink:'#a8b8c0',bathtub:'#f0ebe0',
  shower:'#e8e8e8',vanity:'#cda670',toilet:'#f0ebe0',plant:'#6f8f5a',lamp:'#efe7d6',bookshelf:'#8a6d3b',
  tv:'#1a1814',rug:'#a06a55',counter:'#b8a888',island:'#cda670',stairs:'#cfc8ba',default:'#c9a768'};
var HGT={sofa:.85,armchair:.8,bed:.55,wardrobe:2.2,dresser:.9,table:.75,desk:.75,chair:.9,
  fridge:1.9,stove:.9,sink:.9,bathtub:.55,shower:2.1,vanity:.85,toilet:.8,plant:1.3,lamp:1.6,
  bookshelf:1.9,tv:.5,rug:.02,island:.9,stairs:2.8,default:.8};
function col(k){for(var c in COL)if(k.includes(c))return COL[c];return COL.default}
function hgt(k){for(var h in HGT)if(k.includes(h))return HGT[h];return HGT.default}

// projection
function P3(x,y,z){var ca=Math.cos(ang),sa=Math.sin(ang),rx=x*ca-y*sa,ry=x*sa+y*ca;
  var tilt=topView?1.4:0.5;
  return[rx*sc*0.86-ry*sc*0.5+ox+cv.width/2,rx*sc*0.5+ry*sc*0.86-z*sc*tilt+oy+cv.height/2]}

function shade(hex,p){var n=parseInt(hex.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=Math.max(0,Math.min(255,r+p));g=Math.max(0,Math.min(255,g+p));b=Math.max(0,Math.min(255,b+p));
  return'rgb('+r+','+g+','+b+')'}

function face(pts,f,s){x.beginPath();x.moveTo(pts[0][0],pts[0][1]);
  for(var i=1;i<pts.length;i++)x.lineTo(pts[i][0],pts[i][1]);x.closePath();
  x.fillStyle=f;x.fill();if(s){x.strokeStyle=s;x.lineWidth=.5;x.stroke()}}

function box3d(px,py,pw,pd,ph,c){
  var x2=px+pw,y2=py+pd;
  var b00=P3(px,py,0),b10=P3(x2,py,0),b11=P3(x2,y2,0),b01=P3(px,y2,0);
  var t00=P3(px,py,ph),t10=P3(x2,py,ph),t11=P3(x2,y2,ph),t01=P3(px,y2,ph);
  face([b10,b11,t11,t10],shade(c,-35));face([b11,b01,t01,t11],shade(c,-55));face([t00,t10,t11,t01],c,'rgba(0,0,0,.15)')}

function sofa3d(px,py,pw,pd,c){
  var h=.45,hb=.85,x2=px+pw,y2=py+pd;
  box3d(px,py,pw,pd,h,c);
  // backrest
  var bw=pw*.18;box3d(px,py,bw,pd,hb,shade(c,-15));
  // arms
  var aw=pd*.15;box3d(px,py,pw,aw,hb,shade(c,-10));box3d(px,y2-aw,pw,aw,hb,shade(c,-10));
  // cushions
  var nc=Math.max(2,Math.round(pw*3));var cw=pw/nc;
  for(var i=0;i<nc;i++)box3d(px+i*cw+cw*.1,py+pd*.2,cw*.8,pd*.6,h+.05,shade(c,10))}

function bed3d(px,py,pw,pd,c){
  var h=.55,x2=px+pw,y2=py+pd;
  box3d(px,py,pw,pd,h,c);
  // headboard
  box3d(px,py,pw,pd*.1,1.2,shade(c,-25));
  // pillows
  var pw2=pw*.42;box3d(px+pw*.04,py+pd*.12,pw2,pd*.12,h+.08,'#f5f0e8');
  box3d(px+pw*.54,py+pd*.12,pw2,pd*.12,h+.08,'#f5f0e8');
  // blanket
  box3d(px+pw*.05,py+pd*.35,pw*.9,pd*.55,h+.03,shade(c,-10))}

function wall3d(w){
  var len=Math.hypot(w.x2-w.x1,w.y2-w.y1);if(len<.05)return;
  var t=w.t||.15,a=Math.atan2(w.y2-w.y1,w.x2-w.x1);
  var px=Math.cos(a),py=Math.sin(a),nx=-py*t/2,ny=px*t/2;
  var x1=w.x1+nx,y1=w.y1+ny,x2=w.x2+nx,y2=w.y2+ny,x3=w.x2-nx,y3=w.y2-ny,x4=w.x1-nx,y4=w.y1-ny;
  var b1=P3(x1,y1,0),b2=P3(x2,y2,0),b3=P3(x3,y3,0),b4=P3(x4,y4,0);
  var t1=P3(x1,y1,WH),t2=P3(x2,y2,WH),t3=P3(x3,y3,WH),t4=P3(x4,y4,WH);
  face([b1,b2,t2,t1],'#d4d0c8');face([b3,b4,t4,t3],'#c4c0b8');face([t1,t2,t3,t4],'#e4e0d8','rgba(0,0,0,.1)')}

function drawFloor(){
  if(!W.length)return;
  var mX=1e9,mY=1e9,MX=-1e9,MY=-1e9;
  W.forEach(function(w){mX=Math.min(mX,w.x1,w.x2);mY=Math.min(mY,w.y1,w.y2);MX=Math.max(MX,w.x1,w.x2);MY=Math.max(MY,w.y1,w.y2)});
  var p1=P3(mX,mY,0),p2=P3(MX,mY,0),p3=P3(MX,MY,0),p4=P3(mX,MY,0);
  face([p1,p2,p3,p4],'#3a3328');
  // room fills
  if(RM.length)RM.forEach(function(r){if(r.pts&&r.pts.length>=3){
    var pts=r.pts.map(function(p){return P3(p.x,p.y,0.01)});
    face(pts,'rgba(197,160,89,0.04)');
  }});
}

function render(){
  x.fillStyle='#0e1117';x.fillRect(0,0,cv.width,cv.height);
  drawFloor();
  var geo=[];
  W.forEach(function(w,i){var cx=(w.x1+w.x2)/2,cy=(w.y1+w.y2)/2;
    geo.push({t:'w',d:w,z:cx*Math.cos(ang)+cy*Math.sin(ang)})});
  I.forEach(function(it){
    if(it.kind==='door'||it.kind==='window'||it.kind==='label'||it.hidden)return;
    geo.push({t:'i',d:it,z:it.x*Math.cos(ang)+it.y*Math.sin(ang)})});
  geo.sort(function(a,b){return a.z-b.z});
  geo.forEach(function(g){
    if(g.t==='w')wall3d(g.d);
    else{var it=g.d,w=it.w||1,d=it.h||1,h=hgt(it.kind),c=col(it.kind),cx=it.x-w/2,cy=it.y-d/2;
      if(it.kind.includes('sofa')||it.kind.includes('armchair'))sofa3d(cx,cy,w,d,c);
      else if(it.kind.includes('bed'))bed3d(cx,cy,w,d,c);
      else box3d(cx,cy,w,d,h,c)}});
  document.getElementById('info').textContent=W.length+' حائط · '+I.filter(function(i){return i.kind!=='door'&&i.kind!=='window'&&i.kind!=='label'&&!i.hidden}).length+' قطعة';
}
function resize(){cv.width=innerWidth;cv.height=innerHeight;render()}
addEventListener('resize',resize);

// controls
var dr=false,sx=0,sy=0;
cv.addEventListener('mousedown',function(e){dr=true;sx=e.clientX;sy=e.clientY});
cv.addEventListener('mousemove',function(e){if(!dr)return;
  ang+=(e.clientX-sx)*.008;ox+=(e.clientX-sx)*.3;oy+=(e.clientY-sy)*.3;sx=e.clientX;sy=e.clientY;render()});
cv.addEventListener('mouseup',function(){dr=false});cv.addEventListener('mouseleave',function(){dr=false});
cv.addEventListener('touchstart',function(e){var t=e.touches[0];dr=true;sx=t.clientX;sy=t.clientY},{passive:true});
cv.addEventListener('touchmove',function(e){if(!dr)return;e.preventDefault();
  var t=e.touches[0];ang+=(t.clientX-sx)*.008;ox+=(t.clientX-sx)*.3;oy+=(t.clientY-sy)*.3;sx=t.clientX;sy=t.clientY;render()},{passive:false});
cv.addEventListener('touchend',function(){dr=false});
document.getElementById('btnIn').addEventListener('click',function(){sc=Math.min(120,sc*1.2);render()});
document.getElementById('btnOut').addEventListener('click',function(){sc=Math.max(10,sc/1.2);render()});
var sb=document.getElementById('btnSpin');
sb.addEventListener('click',function(){spin=!spin;sb.style.background=spin?'rgba(197,160,89,.3)':'';if(spin)loop()});
function loop(){if(!spin)return;ang+=.004;render();requestAnimationFrame(loop)}
document.getElementById('btnTop').addEventListener('click',function(){topView=!topView;render()});
resize();
})();
</script>
</body>
</html>
